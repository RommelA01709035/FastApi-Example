<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Control de gastos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
  <section class="hero is-fullheight has-background-light">
    <div class="hero-body">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-5-tablet is-4-desktop">
            <h1 class="title has-text-centered">Control de gastos</h1>
            <p class="subtitle is-6 has-text-centered has-text-grey">Gastos, pagos y cuentas bancarias</p>

            <form method="post" action="/login" class="box">
              {% if error %}
                <div class="notification is-danger is-light">{{ error }}</div>
              {% endif %}

              <input type="hidden" name="next" value="{{ next }}">

              <div class="field">
                <label class="label" for="email">Correo</label>
                <div class="control">
                  <input class="input" id="email" name="email" type="email"
                         value="{{ email or '' }}" placeholder="admin@example.com" required autofocus>
                </div>
              </div>

              <div class="field">
                <label class="label" for="password">Contraseña</label>
                <div class="control">
                  <input class="input" id="password" name="password" type="password" required>
                </div>
              </div>

              <div class="field mt-5">
                <button class="button is-primary is-fullwidth">Iniciar sesión</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
