<form method="get" class="mb-4">
  <div class="field has-addons">
    <div class="control">
      <div class="select">
        <select name="status">
          <option value="">Todos los estados</option>
          {% for s in statuses %}
            <option value="{{ s.value }}" {{ "selected" if status == s.value }}>{{ status_labels[s.value] }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="control"><button class="button">Filtrar</button></div>
  </div>
</form>
